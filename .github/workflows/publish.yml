name: Release
on:
  workflow_dispatch:
    inputs:
      addon:
        description: "Insert addon name (e.g. curios, ftbquests)"
        required: true
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    environment: Token
    runs-on: ubuntu-22.04

    container:
      image: mcr.microsoft.com/openjdk/jdk:17-ubuntu
      options: --user root

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle Build and Publish
        run: |
          ./gradlew :${{ inputs.addon }}:build :${{ inputs.addon }}:publishMods
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}