name: Release
on:
  workflow_dispatch:
    inputs:
      addon:
        description: "Insert addon name (e.g. curios, ftbquests)"
        required: true
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    environment: Token
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle Build and Publish
        run: |
          REAL_PROJECT_NAME="addon-${{ inputs.addon }}"
          ./gradlew :$REAL_PROJECT_NAME:build :$REAL_PROJECT_NAME:publishMods
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}