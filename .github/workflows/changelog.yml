name: Changelog

on:
  workflow_dispatch:
    inputs:
      addon:
        description: "Insert addon name (es: curios, ftbquests) or 'all' in order to update everything automatically"
        required: true
        default: "all"
        type: string

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate changelog
        run: python .github/generate_changelog.py "${{ github.event.inputs.addon }}"

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add addon-${{ github.event.inputs.addon }}/CHANGELOG.md
          git commit -m "docs: update changelog" || echo "No changes"
          git push