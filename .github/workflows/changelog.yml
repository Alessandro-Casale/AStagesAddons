name: Changelog

on:
  workflow_dispatch:
    inputs:
      addon:
        description: "Insert addon name (e.g. curios, ftbquests) or 'all'"
        required: true
        default: "all"
        type: string

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          INPUT="${{ github.event.inputs.addon }}"

          if [ "$INPUT" = "all" ]; then
            MATRIX=$(ls -d addon-* | sed 's|addon-||' | jq -R . | jq -s -c .)
          else
            MATRIX=$(echo "[\"$INPUT\"]" | jq -c .)
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  changelog:
    needs: setup
    runs-on: ubuntu-latest

    strategy:
      matrix:
        addon: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
      max-parallel: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate changelog
        run: python .github/generate_changelog.py "${{ matrix.addon }}"

      - name: Commit changes
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          ADDON="${{ matrix.addon }}"

          git add addon-$ADDON/CHANGELOG.md

          echo "Git status:"
          git status

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          VERSION=$(grep "^mod_version=" addon-$ADDON/gradle.properties | cut -d= -f2 | cut -d- -f1)

          git commit -m "docs: Update changelog for $ADDON $VERSION"

          git push origin ${{ github.ref_name }}